<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;

          function getFetch() {
            return activeFetch;
          }
          function setFetch(fn) {
            activeFetch = fn;
          }

          // Ensure window.fetch has both a getter and setter to prevent
          // "Cannot set property fetch of #<Window> which has only a getter"
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: getFetch,
              set: setFetch,
            });
          } catch (e) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: getFetch,
                set: setFetch,
              });
            } catch (e) {}
          }

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                configurable: true,
                enumerable: true,
                get: getFetch,
                set: setFetch,
              });
            } catch (e) {}
          }

          // Suppress unhandled setter error and benign AbortErrors (browser cancels, navigation, transport switching)
          window.addEventListener(
            'error',
            function (evt) {
              var msg = (evt && evt.message ? String(evt.message) : '').toLowerCase();
              if (
                msg.indexOf('cannot set property fetch of') !== -1 ||
                msg.indexOf('aborted') !== -1 ||
                msg.indexOf('signal is aborted') !== -1 ||
                msg.indexOf('user aborted') !== -1
              ) {
                if (evt.preventDefault) evt.preventDefault();
                if (evt.stopPropagation) evt.stopPropagation();
                return true;
              }
            },
            true
          );

          window.addEventListener(
            'unhandledrejection',
            function (evt) {
              var reason = evt && evt.reason;
              if (reason) {
                var name = reason.name || '';
                var msg = (reason.message || String(reason) || '').toLowerCase();
                if (
                  name === 'AbortError' ||
                  msg.indexOf('aborted') !== -1 ||
                  msg.indexOf('signal is aborted') !== -1 ||
                  msg.indexOf('user aborted') !== -1
                ) {
                  if (evt.preventDefault) evt.preventDefault();
                  if (evt.stopPropagation) evt.stopPropagation();
                  return true;
                }
              }
            },
            true
          );
        } catch (err) {
          // Fallback pass-through
        }
      })();
    </script>

    <meta name="robots" content="noindex, nofollow" />
